name: FormFit
options:
  bundleIdPrefix: com.formfit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  FormFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FormFit
        excludes:
          - "Core/LiveActivities/RestTimerLiveActivity.swift"
          - "Core/LiveActivities/RestTimerActivityWidget.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formfit.app
        INFOPLIST_KEY_CFBundleDisplayName: "FormFit"
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "FormFit cần truy cập dữ liệu sức khỏe để đọc nhịp tim và ước tính calo tiêu thụ trong buổi tập."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "FormFit cần lưu lại bài tập và calo tiêu thụ vào Apple Health."
        INFOPLIST_KEY_NSCameraUsageDescription: "FormFit cần quyền Camera để chụp ảnh tiến trình vóc dáng Before/After với Ghost Overlay."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "FormFit cần truy cập thư viện ảnh để lưu và so sánh ảnh tiến trình tập luyện."
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: FormFitWidgets
    capabilities:
      - HealthKit: {}
      - BackgroundModes:
          modes:
            - remote-notification

  FormFitWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FormFit/Core/LiveActivities/RestTimerActivityAttributes.swift
      - path: FormFit/Core/LiveActivities/RestTimerIntents.swift
      - path: FormFit/Core/LiveActivities/RestTimerLiveActivity.swift
      - path: FormFit/Core/LiveActivities/RestTimerActivityWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formfit.app.widgets
        INFOPLIST_KEY_CFBundleDisplayName: "FormFit Widgets"
        INFOPLIST_KEY_NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  FormFitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FormFitTests
    dependencies:
      - target: FormFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formfit.tests
        GENERATE_INFOPLIST_FILE: YES

  FormFitUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FormFitUITests
    dependencies:
      - target: FormFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.formfit.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FormFit:
    build:
      targets:
        FormFit: all
        FormFitWidgets: all
        FormFitTests: [test]
        FormFitUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: FormFit/Core/StoreKit/Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: FormFitTests
        - name: FormFitUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
